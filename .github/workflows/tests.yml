name: Pruebas Python y Spark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r tests/requirements-test.txt
      - name: Ejecutar la suite completa
        run: python -m pytest tests -v
