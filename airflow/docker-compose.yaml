# Airflow local para DATAMARCA: LocalExecutor + PostgreSQL (metastore).
# Uso (desde la carpeta airflow/):
#   docker compose build
#   docker compose up airflow-init
#   docker compose up -d
#   UI: http://localhost:8080  (usuario "airflow"; la contraseña la imprime el api-server en sus logs)
x-airflow-common: &airflow-common
  build: .
  env_file:
    - path: .env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/datamarca/airflow/dags
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
    AIRFLOW__API_AUTH__JWT_SECRET: datamarca-local-no-usar-en-produccion
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"
    DATAMARCA_HOME: /opt/datamarca
    DATAMARCA_PYTHON: python
  volumes:
    - ..:/opt/datamarca          # todo el repositorio: DAG, src/, data/ y reports/
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

volumes:
  pgdata:
  airflow-logs:
